tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng để lấy thêm thông tin cần thiết."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản Twitter (chỉ chứa username, KHÔNG có dấu @, ví dụ: 'sama')"}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội theo từ khóa chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp (Top cho phổ biến, Latest cho mới nhất)"}
        limit: {type: integer, default: 5, description: "Số lượng bài viết"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chính (nếu tìm news/tin tức thì CHỈ nhập từ khóa lõi, ví dụ: 'AI' thay vì 'tin tức AI')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại (chọn news nếu tìm tin tức)"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian (day cho 'hôm nay')"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc và lấy nội dung text từ một URL cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã thu thập thành markdown report."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung đến một hệ thống bên ngoài (Telegram)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận. LUÔN phải đặt là false nếu người dùng chưa xác nhận."}
      required: [text]

