  - name: youtube_summarizer
    description: "Lấy phụ đề (transcript) của video Youtube từ URL để có thể đọc và tóm tắt."
    parameters:
      type: object
      properties:
        url: {type: string, description: "Đường dẫn URL của video Youtube"}
        max_chars: {type: integer, default: 15000, description: "Giới hạn số ký tự"}
      required: [url]

  - name: weather_forecast
    description: "Lấy thông tin thời tiết hiện tại hoặc thời tiết trong quá khứ."
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "Tên địa điểm (ví dụ: Hanoi, Tokyo). Để trống để lấy thời tiết theo IP hiện tại."}
        date: {type: string, default: "", description: "Ngày cần tra cứu theo định dạng YYYY-MM-DD. Bỏ trống nếu muốn xem thời tiết hiện tại."}

  - name: crypto_tracker
    description: "Tra cứu giá hiện tại của các đồng tiền điện tử phổ biến."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "BTCUSDT", description: "Mã giao dịch (ví dụ: BTC, ETH). Mặc định là BTC."}

  - name: github_explorer
    description: "Tìm kiếm các repository đang hot/trending trên Github."
    parameters:
      type: object
      properties:
        query: {type: string, default: "AI", description: "Từ khóa tìm kiếm (ví dụ: AI, agent)"}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình (ví dụ: python, javascript)"}
        limit: {type: integer, default: 5, description: "Số lượng kết quả trả về"}
      required: [query]

  - name: image_generator
    description: "Sinh ảnh minh họa bằng AI dựa trên mô tả văn bản."
    parameters:
      type: object
      properties:
        prompt: {type: string, description: "Mô tả bức ảnh bằng tiếng Anh chi tiết"}
      required: [prompt]
